services:

  # ── Veritabanı ─────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: finans_db
    environment:
      POSTGRES_DB: finans_portali
      POSTGRES_USER: finansportali
      POSTGRES_PASSWORD: "0000"
    ports:
      - "5434:5432"
    volumes:
      - finans_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finansportali -d finans_portali"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Keycloak (Kimlik Yönetimi) ──────────────────────────────
  # DÜZELTME: --import-realm eklendi, realm JSON otomatik yüklenir
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: finans_keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/finans_portali
      KC_DB_USERNAME: finansportali
      KC_DB_PASSWORD: "0000"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8180"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import

  # ── Redis (Cache) ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: finans_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Zookeeper (Kafka için) ──────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: finans_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log

  # ── Kafka (Log Pipeline) ────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: finans_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── OpenSearch (Log Depolama & Analiz) ─────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.12.0
    container_name: finans_opensearch
    environment:
      - cluster.name=finans-portali-logs
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # ── OpenSearch Dashboards ────────────────────────────────────
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.12.0
    container_name: finans_opensearch_dashboards
    depends_on:
      - opensearch
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"

  # ── Backend (Spring Boot) ───────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finans_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/finans_portali
      SPRING_DATASOURCE_USERNAME: finansportali
      SPRING_DATASOURCE_PASSWORD: "0000"
      SPRING_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8180
      OPENSEARCH_HOST: http://opensearch:9200
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: "http://otel-collector:4318/v1/metrics"
      MANAGEMENT_OTLP_TRACING_ENDPOINT: "http://otel-collector:4317"
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      COLLECT_API_KEY: ${COLLECT_API_KEY:-}
      GEMINI_CHAT_KEY: ${GEMINI_CHAT_KEY:-}
      GEMINI_PORTFOLIO_KEY: ${GEMINI_PORTFOLIO_KEY:-}
      GEMINI_DASHBOARD_KEY: ${GEMINI_DASHBOARD_KEY:-}
      GEMINI_NEWS_KEY: ${GEMINI_NEWS_KEY:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - backend_logs:/app/logs

  # ── OpenTelemetry Collector ─────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: finans_otel_collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector internal metrics
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    depends_on:
      - opensearch

  # ── Prometheus (Metrik Toplama) ─────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: finans_prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend

  # ── Grafana (Metrik Görselleştirme) ─────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: finans_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ── Frontend (Nginx + React) ────────────────────────────────
  # DÜZELTME: nginx.conf proxy ile /api → backend yönlendirmesi
  # DÜZELTME: VITE_API_BASE_URL localhost yerine nginx proxy kullanıyor
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finans_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      VITE_KEYCLOAK_URL: http://localhost:8180

volumes:
  finans_db_data:
  keycloak_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  opensearch_data:
  backend_logs:
  prometheus_data:
  grafana_data:
