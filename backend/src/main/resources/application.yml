spring:
  application:
    name: finans-portali-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/finans_portali}
    username: ${SPRING_DATASOURCE_USERNAME:finansportali}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    test-connection: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: log-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.finansportali: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/finans-portali.log

opensearch:
  host: ${OPENSEARCH_HOST:http://localhost:9200}

finans:
  api:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    collect-api:
      base-url: https://api.collectapi.com/economy
      api-key: ${COLLECT_API_KEY:}
    coingecko:
      base-url: https://api.coingecko.com/api/v3
    newsapi:
      base-url: https://newsapi.org/v2
      api-key: ${NEWSAPI_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}
  scheduler:
    tcmb-cron: "0 0 */4 * * MON-FRI"
    kripto-cron: "0 0 */2 * * *"
    hisse-cron: "0 0 */3 * * MON-FRI"
    haber-cron: "0 */30 * * * *"
