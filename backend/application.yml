spring:
  application:
    name: finans-portali-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/finans_portali}
    username: ${SPRING_DATASOURCE_USERNAME:finansportali}
    password: ${SPRING_DATASOURCE_PASSWORD:0000}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379

  cache:
    type: redis

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.finansportali: DEBUG
    org.springframework.web: INFO

finans:
  api:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    collect-api:
      base-url: https://api.collectapi.com/economy
      api-key: ${COLLECT_API_KEY:apikey 1Ub3SplXxFSVowj1lI0vys:4W5ZJMBGNASQkF0WWCBb4B}
    coingecko:
      base-url: https://api.coingecko.com/api/v3
    newsapi:
      base-url: https://newsapi.org/v2
      api-key: ${NEWSAPI_KEY:2f93260f8c034dd8a7dfa041ee513174}
  scheduler:
    tcmb-cron: "0 31 15 * * MON-FRI"
    kripto-cron: "0 0 */2 * * *"
    hisse-cron: "0 35 15 * * MON-FRI"
    haber-cron: "0 */30 * * * *"
