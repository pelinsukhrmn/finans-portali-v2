receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 2s
    send_batch_size: 512
    send_batch_max_size: 1024

  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  # Prometheus formatında metrik sunumu (Prometheus bu endpoint'i scrape eder)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: finans_portali

  # Debug/log çıktısı
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
